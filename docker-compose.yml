version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: wechat-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: wechat_auto_reply
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+8:00
    restart: always
    networks:
      - wechat-network

  redis:
    image: redis:7-alpine
    container_name: wechat-redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes
    restart: always
    networks:
      - wechat-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wechat-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/wechat_auto_reply?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123456
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_SECRET: ${WECHAT_SECRET}
      WECHAT_TOKEN: ${WECHAT_TOKEN}
      WECHAT_AES_KEY: ${WECHAT_AES_KEY}
      JWT_SECRET: ${JWT_SECRET}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    restart: on-failure
    networks:
      - wechat-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wechat-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
    networks:
      - wechat-network

networks:
  wechat-network:
    driver: bridge
